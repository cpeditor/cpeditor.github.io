---
title: 下載 CP Editor
linkTitle: 下載軟體
menu:
  main:
    weight: 50
---

<link rel="stylesheet" href="/css/style.css">

<script src="https://cdn.jsdelivr.net/npm/vue@2.6/dist/vue.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/filesize@6.4"></script>
<script src="/js/download.js"></script>

<style>
    [v-cloak] {
        display: none;
    }
</style>

<div id="app">
    <div class="download-wrapper">
    <div class="download-hero">
        <div class="container">
            <h1>立即安裝 CP Editor</h1>
            <p v-cloak v-if="latestStableAssetForUserPlatform">
                您可能想找適用於
                <a :href="latestStableAssetForUserPlatform.browser_download_url">{{ userPlatform }} 系統的最新穩定版</a>。
            </p>
            <p v-cloak v-else>選擇您的平台和版本以開始下載。</p>
        </div>
    </div>

    <div class="download-container">
        <div class="container">
            <div class="download-row">
                <div class="download-info">
                    <h2>安裝選項</h2>
                    <ul>
                        <li><a href="../docs/installation">安裝說明</a></li>
                        <li><a href="https://github.com/cpeditor/cpeditor/releases" target="_blank">瀏覽所有版本</a></li>
                    </ul>
                </div>
                <div v-cloak class="download-form">
                    <h3 v-if="releases.length === 0" class="loading-text">載入中...</h3>
                    <h3 v-else-if="!selectedAsset" class="text-warning">未取得可用的檔案清單</h3>
                    <template v-else>
                        <h3>下載 CP Editor</h3>
                        <div class="form-group">
                            <label for="platform">作業系統</label>
                            <select id="platform" v-model="selectedPlatform">
                                <option v-for="platformOption in platformOptions">{{ platformOption }}</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="release">版本</label>
                            <select id="release" v-model="selectedRelease">
                                <template v-for="release in releases" :key="release.tag_name">
                                    <option :value="release">
                                        v{{ release.tag_name }}
                                        <span v-if="release === latestStableRelease">（最新穩定版）</span>
                                        <span v-else-if="release === releases[0]">（最新 Beta 版）</span>
                                    </option>
                                </template>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="asset">檔案</label>
                            <select id="asset" v-model="selectedAsset">
                                <template v-for="asset in selectedRelease.assets" :key="asset.id">
                                    <option v-if="isAssetSuitableForPlatform(asset, selectedPlatform)" :value="asset">
                                        {{ asset.name }} ({{ filesize(asset.size, { precision: 3 }) }})
                                    </option>
                                </template>
                            </select>
                        </div>
                        <a :href="selectedAsset.browser_download_url"
                            :disabled="selectedAsset.browser_download_url === undefined"
                            class="download-btn">下載</a>
                    </template>
                </div>
            </div>
        </div>
    </div>
</div></div>
